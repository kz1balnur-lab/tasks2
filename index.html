<div class="app" id="layout">

  <aside class="sidebar" id="topicsPanel" data-i18n-aria="topicsTitle" aria-label="ІІ тоқсан тақырыптары">
    <div class="sb-brand">
      <span class="sb-logo" data-icon="atom" data-icon-size="22"></span>
      <div>

        <div class="sb-sub">Learning Platform</div>
      </div>
      <button class="icon-btn sb-collapse" id="btnCollapseLeft" data-icon="panelLeft" data-i18n-title="hidePanel" data-i18n-aria="hidePanel" title="Панельді жасыру" aria-label="Панельді жасыру"></button>

      <div class="ws-actions">
        <div class="lang-switch" role="group" aria-label="Тіл / Язык / Language">
          <button data-lang="kk" class="active">ҚАЗ</button><button data-lang="ru">РУС</button><button data-lang="en">ENG</button>

        <button class="icon-btn" id="btnA11y" data-icon="eye" aria-expanded="false" data-i18n-title="a11yBtn" data-i18n-aria="a11yBtn" title="Нашар көретіндерге"></button>

      </div>
    </div>

    <div class="a11y-bar" id="a11yBar" hidden>
      <div class="a11y-group" role="group" data-i18n-aria="fontSize" aria-label="Қаріп өлшемі">
        <button class="a11y-btn fs1 active" data-fs="1" data-i18n-title="fs1" title="Қалыпты қаріп">A</button>
        <button class="a11y-btn fs2" data-fs="2" data-i18n-title="fs2" title="Үлкен қаріп">A</button>
        <button class="a11y-btn fs3" data-fs="3" data-i18n-title="fs3" title="Өте үлкен қаріп">A</button>
      </div>
      <div class="a11y-group" role="group" data-i18n-aria="colorScheme" aria-label="Түс схемасы">
        <button class="a11y-btn sch-default active" data-scheme="default" data-i18n-title="schDefault" title="Ақ фон">Aa</button>
        <button class="a11y-btn sch-bw" data-scheme="bw" data-i18n-title="schBw" title="Қара фон, ақ мәтін">Aa</button>
        <button class="a11y-btn sch-by" data-scheme="by" data-i18n-title="schBy" title="Қара фон, сары мәтін">Aa</button>
        <button class="a11y-btn sch-blue" data-scheme="blue" data-i18n-title="schBlue" title="Көгілдір фон">Aa</button>
      </div>
      <div class="a11y-group">
        <button class="a11y-btn" id="btnImgMode" data-icon="image" data-icon-size="18" data-i18n-title="imgMode" title="Суреттер"></button>
        <button class="a11y-btn" id="btnA11yReset" data-icon="eye" data-icon-size="18" data-i18n-title="a11yReset" title="Қалыпты нұсқа"></button>
      </div>
      <span class="a11y-note" id="imgModeLabel"></span>
    </div>

    <div class="ws-body"><div id="view"></div></div>
  </main>

  <!-- ═════════ ОҢ ЖАҚ: AI КӨМЕКШІ ═════════ -->

<!-- Калькулятор батырмасы -->
<button class="calc-fab" id="btnCalc" aria-expanded="false" data-icon="calculator"><span data-i18n="calc">Калькулятор</span></button>

<!-- ═════════ КАЛЬКУЛЯТОР ═════════ -->
<section class="calc sci" id="calc" hidden data-i18n-aria="calc" aria-label="Калькулятор">
  <header class="calc-head" id="calcHead">
    <span data-i18n="calc">Калькулятор</span>
    <span class="calc-flags"><span class="calc-flag" id="calcAngle">DEG</span><span class="calc-flag" id="calcMem" hidden>M</span></span>
    <span class="grow"></span>
    <button class="calc-sci-btn" id="calcSci" type="button" aria-pressed="true" data-i18n-title="calcSciMode" title="Ғылыми функциялар">f(x)</button>
    <button class="icon-btn" id="calcClose" data-icon="x" data-i18n-aria="close" aria-label="Жабу"></button>
  </header>
  <div class="calc-screen">
    <div class="calc-hist" id="calcHist"></div>
    <input class="calc-expr" id="calcExpr" inputmode="decimal" autocomplete="off" spellcheck="false" data-i18n-aria="calcExpr" aria-label="Өрнек">
    <div class="calc-res" id="calcRes">0</div>
  </div>
  <div class="calc-keys" id="calcKeys"></div>
</section>

<!-- ═════════ МОДАЛЬДЫ ТЕРЕЗЕ ═════════ -->
